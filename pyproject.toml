[project]
name = "pde-icl"
version = "0.1.0"
description = "Train a TabPFN/TabICL-style in-context learner on the pde_priors geometry-conditioned PDE prior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pde-priors",
    "tabicl[pretrain,finetune]",
    "torch>=2.2",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pde_icl"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.uv.sources]
pde-priors = { path = "../pde-priors", editable = true }
# TabICL: pinned to the GitHub HEAD (Jul 2026), the only source whose
# `tabicl.train` supports `--regression_method quantile` (PyPI 2.1.1 is
# classification-only and cannot train our regression objective).
tabicl = { git = "https://github.com/soda-inria/tabicl", rev = "46b91961db4f8873dd049ec09990698a435e1e29" }

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m=not cuda and not slow and not benchmark"]
testpaths = ["tests"]
markers = [
    "cuda: tests that require a CUDA-capable device",
    "slow: tests that are too slow for the default suite",
    "benchmark: performance benchmark tests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "tabicl.*", "pde_priors.*"]
ignore_missing_imports = true
